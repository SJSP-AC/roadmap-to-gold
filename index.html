<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Roadmap to Gold — Coach Marc Montoya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>(function(){try{var t=localStorage.getItem("pg-r2-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<style id="pg-style">
:root{
  --ground:#F3F2EE; --surface:#FFFFFF; --ink:#16140F; --muted:#67625A; --line:#DEDAD1;
  --gold:#A87B22; --gold-ink:#7A5714; --gold-wash:#F3E9D2; --chip:#ECEAE4; --ok:#2F6B45; --warn:#8A3B1E;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12110F; --surface:#1B1A17; --ink:#ECE8DF; --muted:#9C968A; --line:#2E2C27;
    --gold:#D4A547; --gold-ink:#E5BD6A; --gold-wash:#2E2615; --chip:#262420; --ok:#7FC093; --warn:#E39A7C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#12110F; --surface:#1B1A17; --ink:#ECE8DF; --muted:#9C968A; --line:#2E2C27;
  --gold:#D4A547; --gold-ink:#E5BD6A; --gold-wash:#2E2615; --chip:#262420; --ok:#7FC093; --warn:#E39A7C;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--gold-ink)}
.wrap{max-width:860px;margin:0 auto;padding-inline:20px;padding-block:28px 140px}
@media (max-width:480px){.wrap{padding-inline:16px}}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
h1{font:800 clamp(38px,7.5vw,60px)/.92 var(--display);letter-spacing:.01em;text-transform:uppercase;margin:10px 0 14px;text-wrap:balance}
.lede{max-width:64ch;margin:0 0 10px}
.lede.muted{color:var(--muted)}
.lede.sourceline{font-size:11.6px;line-height:1.5;letter-spacing:.02em}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:22px 0 8px}
.how div{background:var(--surface);padding:12px 14px;font-size:13.5px}
.how b{display:block;font:800 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:4px}
@media (max-width:640px){.how{grid-template-columns:1fr}}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ground);border-bottom:1px solid var(--line);margin:24px -20px 0;padding:10px 20px}
@media (max-width:480px){.bar{margin-inline:-16px;padding-inline:16px}}
.bar-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter-track{width:110px;height:6px;background:var(--chip);position:relative}
.meter-fill{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0}
.toggle{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--body);padding:6px 10px;cursor:pointer}
.toggle:hover{color:var(--gold-ink);border-color:var(--gold)}
.bar-btns{display:flex;align-items:center;gap:8px}
.theme-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 8px;line-height:0}
.theme-ico{width:14px;height:14px;border-radius:50%;display:block;
  background:linear-gradient(90deg,var(--gold) 0 50%,#16140F 50% 100%);
  box-shadow:0 0 0 1px var(--gold);transition:transform .2s ease}
.theme-btn:hover .theme-ico,.theme-btn:focus-visible .theme-ico{transform:rotate(180deg)}
:root[data-theme="dark"] .theme-ico{background:linear-gradient(90deg,var(--gold) 0 50%,#0C0B09 50% 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme-ico{background:linear-gradient(90deg,var(--gold) 0 50%,#0C0B09 50% 100%)}}
.jump{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.jump a{font:600 11.5px var(--body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted);border:1px solid var(--line);background:var(--surface);padding:5px 9px}
.jump a{display:inline-flex;align-items:baseline;gap:6px;transition:background .12s,color .12s,border-color .12s}
.jump a em{font-style:normal;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.04em;transition:color .12s}
.jump a:hover,.jump a:focus-visible{color:#fff;background:var(--gold);border-color:var(--gold);outline:none}
.jump a:hover em,.jump a:focus-visible em{color:#fff}
/* the dark palette gold is far too light for white text, so the hover chip
   uses a deeper gold there and the white stays readable */
:root[data-theme="dark"] .jump a:hover,:root[data-theme="dark"] .jump a:focus-visible{background:#96691A;border-color:#96691A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .jump a:hover,:root:not([data-theme="light"]) .jump a:focus-visible{background:#96691A;border-color:#96691A}}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.shell{margin-top:22px}
.sidenav{display:none}
@media (min-width:1040px){
  .wrap{max-width:1100px}
  .shell{display:grid;grid-template-columns:190px 1fr;gap:44px;align-items:start}
  .sidenav{display:block;position:sticky;top:96px}
  .sidenav ol{list-style:none;margin:0;padding:0;border-left:1px solid var(--line)}
  .sidenav a{display:block;text-decoration:none;color:var(--muted);font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:9px 0 9px 14px;margin-left:-1px;border-left:2px solid transparent}
  .sidenav a:hover{color:var(--gold-ink)}
  .sidenav a[aria-current="true"]{color:var(--ink);border-left-color:var(--gold)}
  .sidenav .num{color:var(--gold-ink);margin-right:7px;font-variant-numeric:tabular-nums}
  .jump{display:none}
}
.secs{border-top:2px solid var(--ink)}
section.sec{border-bottom:1px solid var(--line);scroll-margin-top:72px}
.sec-h{margin:0}
.sec-toggle{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 2px}
.sec-num{font:800 12px/1 var(--display);color:var(--gold-ink);letter-spacing:.12em;display:block;margin-bottom:5px}
.sec-title{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.sec-right{display:flex;align-items:center;gap:12px;flex:none}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.sec-toggle[aria-expanded="true"] .chev{transform:rotate(-135deg) translateX(-2px)}
.sec-toggle:hover .sec-title{color:var(--gold-ink)}
.sec-note{font-size:12.5px;color:var(--muted);white-space:nowrap}
.sec-body{padding-bottom:22px}
@media (max-width:560px){
  .sec-toggle > span:first-child{flex:1;min-width:0}
  .sec-right{align-items:flex-start}
  .sec-note{white-space:normal;max-width:108px;text-align:right;line-height:1.35}
  .sec-title{font-size:21px}
}
h3{font:800 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px;color:var(--gold-ink)}
p{max-width:68ch}
.muted{color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font:800 30px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}

.chartwrap{border:1px solid var(--line);background:var(--surface);padding:16px;margin:14px 0}
.chartrow{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin:10px 0}
.chartrow .lbl{font:600 12.5px var(--body);color:var(--muted)}
.chartrow .sub{font-weight:400;font-size:11.5px;color:var(--muted)}
.chartrow{grid-template-columns:120px 1fr}
.stack{display:flex;height:26px;background:var(--chip);overflow:hidden}
.seg{height:100%}
.seg.c1{background:var(--gold)}
.seg.c2{background:#6E5121}
.seg.c3{background:#B79A62}
.seg.c4{background:#8A6C33}
.seg.c5{background:#D9C79A}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}
.total{font:600 13px var(--body);color:var(--ink);font-variant-numeric:tabular-nums}

.tbl{overflow-x:auto;margin:10px 0;border:1px solid var(--line);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--ground);position:sticky;top:0}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{color:var(--gold-ink)}
th .arrow{opacity:.35;margin-left:4px}
th[aria-sort] .arrow{opacity:1;color:var(--gold-ink)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--gold-wash)}
tr.grouprow td{background:var(--ground);font:800 13px var(--display);text-transform:uppercase;letter-spacing:.08em;color:var(--gold-ink)}
tr.grouprow:hover td{background:var(--ground)}
tr.subtotal td{font-weight:600;color:var(--muted);border-top:1px solid var(--line)}
tr.subtotal:hover td{background:transparent}
.ownerbars{display:grid;gap:8px;margin:12px 0 4px}
.ownerbar{display:grid;grid-template-columns:64px 1fr 110px;gap:12px;align-items:center;font-size:13px}
.ownerbar .track{display:block;height:20px;background:var(--chip)}
.ownerbar .fill{display:block;height:100%;background:var(--gold)}
.ownerbar .fill.o2{background:#8A6C33}
.ownerbar .fill.o3{background:#B79A62}
.ownerbar b{font:600 13px var(--body)}
.ownerbar .val{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.rec td{background:var(--gold-wash)}
table.cmp{min-width:680px}
table.cmp td{font-size:13px}
table.cmp th:first-child,table.cmp td:first-child{width:20%;font-weight:600;color:var(--muted)}
table.cmp td:first-child{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em}
table.cmp td.num{font-variant-numeric:tabular-nums;white-space:normal}
.addon{margin:12px 0;border:1px solid var(--gold);background:var(--gold-wash)}
.addon-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 13px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.addon-toggle:hover{background:rgba(0,0,0,.03)}
.ad-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.ad-cta{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.ad-nm{font:700 14.5px var(--display)}
.ad-px{font:700 14px var(--display);color:var(--gold-ink);white-space:nowrap}
.ad-body{padding:0 13px 13px;border-top:1px solid var(--gold)}
.ad-body>b{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:11px 0 6px}
.ad-body ul{margin:0;padding:0 0 0 18px}
.ad-body li{font-size:13px;margin:0 0 6px}
.ad-note{font-size:12.5px;color:var(--muted);font-style:italic;margin:10px 0 0;padding-top:9px;border-top:1px dashed var(--line);max-width:none}
@media (max-width:520px){.addon-toggle{flex-wrap:wrap}.ad-px{margin-left:auto}}
.smx{margin:14px 0 6px}
.smx-key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:11px}
.smx-kitem{display:inline-flex;align-items:center;gap:7px;font:600 12px var(--body);color:var(--muted)}
.smx-sw{width:11px;height:11px;display:inline-block;flex:0 0 auto}
.smx-row{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;padding:5px 0}
.smx-lab{font:800 12px var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.smx-row.rec .smx-lab{color:var(--ink)}
.smx-track{display:flex;gap:2px;height:22px;border-bottom:1px solid var(--line)}
.smx-seg{display:flex;align-items:center;justify-content:center;font:700 11.5px var(--body);font-variant-numeric:tabular-nums;min-width:0;transition:opacity .12s}
.smx-seg:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.smx-track:hover .smx-seg{opacity:.55}
.smx-track .smx-seg:hover{opacity:1}
.smx-tot{font:700 12.5px var(--body);font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.smx-foot{margin-top:9px;font-size:12px;color:var(--muted)}
.smx-a{background:#D8CBA8;color:#16140F;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10)}
.smx-r{background:#B4862A;color:#16140F}
.smx-s{background:#6B4A10;color:#FFFFFF}
:root[data-theme="dark"] .smx-a{background:#5A5348;color:#FFFFFF;box-shadow:none}
:root[data-theme="dark"] .smx-r{background:#B0862F;color:#16140F}
:root[data-theme="dark"] .smx-s{background:#E7C87E;color:#16140F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .smx-a{background:#5A5348;color:#FFFFFF;box-shadow:none}:root:not([data-theme="light"]) .smx-r{background:#B0862F;color:#16140F}:root:not([data-theme="light"]) .smx-s{background:#E7C87E;color:#16140F}}
@media (max-width:520px){.smx-row{grid-template-columns:1fr auto;gap:6px 10px}.smx-lab{grid-column:1/-1;margin-bottom:-2px}}
.tnotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start;margin:-4px 0 4px}
.tnote{border:1px solid var(--line);background:var(--surface)}
.tnote:has(.tn-toggle[aria-expanded="true"]){border-color:var(--gold)}
.tn-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:11px 13px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tn-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.tn-cta{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.tn-nm{font:700 15px var(--display);text-transform:uppercase;letter-spacing:.04em}
.tn-toggle:hover .tn-cta{color:var(--gold)}
.tn-toggle:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.tn-toggle[aria-expanded="true"] .chev{transform:rotate(-135deg) translateX(-2px)}
.tn-toggle[aria-expanded="false"] .chev{transform:rotate(45deg) translateY(-3px)}
.tn-body{padding:0 13px 13px;font-size:13.5px}
.tn-body p{margin:0;max-width:none}
.gate{max-width:430px;margin:14vh auto 0;padding:0 20px}
.gate h1{margin:0 0 16px}
.gate-note{margin:0 0 20px;font-size:14.5px;line-height:1.55;color:var(--muted);max-width:none}
.gate-form{display:flex;gap:8px}
.gate-form input{flex:1;min-width:0;font:400 15px var(--body);padding:10px 12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:0}
.gate-form input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.gate-err{margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--warn);max-width:none}
a.seclink{color:inherit;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:1px;white-space:nowrap}
a.seclink:hover{color:var(--gold-ink);background:var(--gold-wash)}
a.seclink:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h4.xh{font:700 12px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.notyours{font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);opacity:.75;white-space:nowrap}
p.legend{font-size:12.5px;color:var(--muted);margin:10px 0 2px;max-width:none}
p.tstack{font-size:12.5px;color:var(--muted);margin:10px 0 0;padding-top:9px;border-top:1px dashed var(--line);max-width:none}
.feebox{border:2px solid var(--gold);background:var(--gold-wash);padding:14px 16px;margin:12px 0}
.feebox p{margin:0;font-size:15.5px;max-width:none}
.feebox p+p{margin-top:8px;font-size:14px;color:var(--muted)}
.machine{margin:14px 0;border:1px solid var(--line);background:var(--surface)}
.mstage{display:flex;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line)}
.mnum{flex:0 0 28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font:800 13px var(--display)}
.mbody{min-width:0;flex:1}
.mbody h4{margin:2px 0 1px;font:800 15px var(--display);text-transform:uppercase;letter-spacing:.06em}
.mq{margin:0;font:600 13.5px var(--body);color:var(--gold-ink);max-width:none}
.mw{margin:4px 0 0;font-size:13.5px;color:var(--muted);max-width:none}
.mlink{display:inline-block;margin-top:5px;font:600 11px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.mlink:hover{color:var(--gold-ink);border-color:var(--gold)}
.mloop{padding:11px 14px;background:var(--gold-wash);font:600 13px var(--body);color:var(--gold-ink)}
.hmap{margin:16px 0 0}
.hm-tag{display:inline-block;font:800 10.5px var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold-wash);padding:3px 9px;margin:0 0 8px}
.hm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.hm-cell{border:1px solid var(--line);background:var(--surface);padding:11px 12px;display:flex;flex-direction:column}
.hm-cell h5{margin:0 0 4px;font:800 13.5px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.hm-cell p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted);max-width:none}
.hm-funnel{display:flex;align-items:center;gap:9px;padding:9px 0;color:var(--muted);font:700 10.5px var(--body);letter-spacing:.13em;text-transform:uppercase}
.hm-funnel:before,.hm-funnel:after{content:"";flex:1;height:1px;background:var(--line)}
.hm-hub{border:2px solid var(--gold);background:var(--surface);padding:15px 15px 13px}
.hm-hub h4{margin:0;font:800 22px var(--display);text-transform:uppercase;letter-spacing:.04em;line-height:1.05;color:var(--ink)}
.hm-hub .hm-sub{margin:3px 0 10px;font:600 12.5px var(--body);color:var(--gold-ink);max-width:none}
.hm-jobs{list-style:none;margin:0;padding:0}
.hm-jobs li{position:relative;padding:4px 0 4px 16px;font-size:13px;line-height:1.45}
.hm-jobs li:before{content:"";position:absolute;left:2px;top:11px;width:6px;height:6px;background:var(--gold)}
.hm-cap{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
.hm-cap b{display:block;font:800 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-bottom:4px}
.hm-cap p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted);max-width:none}
.hm-fork{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.hm-br{border:1px solid var(--line);background:var(--surface);padding:12px}
.hm-br.loopback{border-style:dashed}
.hm-br h5{margin:0 0 6px;font:800 14px var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.hm-steps{list-style:none;margin:0;padding:0}
.hm-steps li{position:relative;padding:3px 0 3px 15px;font-size:12.5px;line-height:1.4}
.hm-steps li:before{content:"";position:absolute;left:3px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--gold)}

/* The monthly table is computed from PHASES + TASKS so it can never drift
   out of step with the work. Each phase's hours are spread evenly across its
   calendar days, then summed per month. */
function monthlyRows(){
  var MONTHS = [[2026,9,"Oct"],[2026,10,"Nov"],[2026,11,"Dec"],[2027,0,"Jan"],[2027,1,"Feb"],[2027,2,"Mar"]];
  var out = MONTHS.map(function(m){ return {label:m[2], y:m[0], m:m[1], hrs:0, running:[]}; });
  PHASES.forEach(function(p){
    if(!p.from || !p.to) return;
    var hrs = 0;
    TASKS.forEach(function(t){ if(t[0]===p.id && t[2]!==FEE_OWNER) hrs += (t[3]||0); });
    var a = new Date(p.from+"T00:00:00"), b = new Date(p.to+"T00:00:00");
    var days = Math.round((b-a)/86400000) + 1;
    if(days <= 0 || !hrs) return;
    var per = hrs/days;
    out.forEach(function(row){
      var ms = new Date(row.y, row.m, 1), me = new Date(row.y, row.m+1, 0);
      var lo = a > ms ? a : ms, hi = b < me ? b : me;
      if(lo <= hi){
        row.hrs += per * (Math.round((hi-lo)/86400000) + 1);
        row.running.push(p.mlab || p.name);
      }
    });
  });
  var peak = 0; out.forEach(function(r){ if(r.hrs > peak) peak = r.hrs; });
  return out.map(function(r){
    return [r.label, r.running.join(" + "), "~"+Math.round(r.hrs), Math.round(r.hrs) >= Math.round(peak)];
  });
}

function renderTasks(){

    else if(sortKey==="owner"){ x=a[2].toLowerCase(); y=b[2].toLowerCase(); }
    else { x=a[1].toLowerCase(); y=b[1].toLowerCase(); }
    if(x<y) return -1*sortDir; if(x>y) return 1*sortDir; return 0;
  });
  var body = document.getElementById("task-body");
  if(!body) return;
  var html = "", grouped = (sortKey==="phase"), lastPhase = null, groupHrs = 0;
  function closeGroup(){

  }
  rows.forEach(function(t){
    if(grouped && t[0]!==lastPhase){
      closeGroup();
      lastPhase = t[0]; groupHrs = 0;
      var ph = null; PHASES.forEach(function(x){ if(x.id===t[0]) ph = x; });
      html += '<tr class="grouprow"><td colspan="3">'+esc(ph.name)+' · '+esc(ph.when)+'</td></tr>';
    }
    groupHrs += shownHrs(t);
    html += '<tr>'+(grouped?"":'<td>'+esc(phaseName(t[0]))+'</td>')+'<td>'+esc(t[1])+'</td><td>'+esc(t[2])+'</td><td class="num">'+hrsCell(t)+'</td></tr>';
  });

/* Progressive disclosure: wrap every h3 and its following siblings into a
   collapsible sub-block. An h3 marked data-keep stays open. */
var SUB_N = 0;
function makeCollapsible(){
  SUB_N = 0;
  var bodies = document.querySelectorAll(".sec-body");
  for(var b=0;b<bodies.length;b++){
    var body = bodies[b], heads = [], kids = body.children, i;
    for(i=0;i<kids.length;i++){ if(kids[i].tagName==="H3" && !kids[i].hasAttribute("data-keep")) heads.push(kids[i]); }
    for(i=0;i<heads.length;i++){
      var h = heads[i], group = [], n = h.nextElementSibling;
      while(n && n.tagName!=="H3"){ group.push(n); n = n.nextElementSibling; }
      if(!group.length) continue;
      SUB_N++;
      var sid = "sub"+SUB_N, open = !!openSecs[sid];
      var wrap = document.createElement("div"); wrap.className = "sub";
      var btn = document.createElement("button");
      btn.type = "button"; btn.className = "sub-toggle";
      btn.setAttribute("data-sec", sid);
      btn.setAttribute("aria-expanded", open?"true":"false");
      btn.setAttribute("aria-controls", "body-"+sid);
      btn.innerHTML = '<span class="sub-title">'+h.innerHTML+'</span><span class="chev"></span>';
      var inner = document.createElement("div");
      inner.id = "body-"+sid; inner.className = "sub-body"; inner.hidden = !open;
      h.parentNode.insertBefore(wrap, h);
      wrap.appendChild(btn); wrap.appendChild(inner);
      for(var g=0; g<group.length; g++){ inner.appendChild(group[g]); }
      h.parentNode.removeChild(h);
    }
  }
}

    '<p><b>Notice the third one has nothing.</b> There is no pillar for Consideration and no slot in the calendar, and that is not an oversight \u2014 it is because there is nothing to point those people at. They believe you, they are not ready for a 90-day Mission, and right now the only thing on offer is to keep following. <b>That is the same gap section 02 names, seen from the content side.</b> Fill that gap and this stage fills itself.</p>'+

    '<p class="muted">The index built in October is what turns this from a shape into a number — how many genuinely usable moments are actually in there, by pillar and by stage. It is the first thing I will tell you when it is done, and it is the number that should decide which level in section 07 you pick.</p>'+
    '<p><b>So the calendar eventually has to be fed by footage that exists because Marc decided to make it.</b> With no talking-head block in the plan, that means either rooms or a shoot — and only one of those is his to schedule. Not soon, and not expensively at first, but it is the one thing here that cannot be avoided by being clever. Section 07 puts a number on it.</p>'+

    "<h3>The newsletter formula</h3>"+'<p>This is the thing you asked me to keep and I would rather you just had it. Six beats, one issue, about 500 words. It works because it is the shape of a coaching conversation, not the shape of a newsletter.</p>'+'<ol class="fmla">'+FORMULA.map(function(f){ return '<li><b>'+esc(f[1])+'</b><span>'+esc(f[2])+'</span></li>'; }).join('')+'</ol>'+'<p><b>Then one line and one ask.</b> Never two asks. The ask changes by month and matches whatever the conversion slot is pointing at.</p>'+'<p class="muted"><b>If you do not have time to write it:</b> record a voice memo answering the six beats out loud — it takes about 4 minutes — get the transcript, then write it up against the formula. The memo does the thinking, the formula does the shape. Worth being straight with you about the limit: right now that last step is still a person sitting down with the transcript. Turning a voice memo into a finished draft on its own needs the system built underneath it, and that is not built yet.</p>'+'<h3>Not doing</h3>'+

    '<p>They do different jobs. <b>Instagram reaches the audience you already have.</b> It is where the fight world is, and it is where the story and the personality land hardest. <b>LinkedIn reaches the buyer you do not have yet.</b> Founders, leaders and executives are on it daily and most of them are not on Instagram at all — which is the whole of section 02 in one sentence.</p>'+

/* every "section NN" in prose becomes a link that jumps and opens it */
var SEC_BY_NUM = {"01":"north","02":"constraint","03":"engine","04":"content","05":"site",
  "06":"sales","07":"runs","08":"roadmap","09":"together","10":"decisions","11":"ladder"};
function linkifySections(root){
  var scope = root || document.getElementById("pg-root");
  if(!scope) return;
  var re = /\b(sections?)\s+(0[1-9]|1[01])\b/gi;
  var walker = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null, false);
  var nodes = [], nd;
  while((nd = walker.nextNode())){
    if(!re.test(nd.nodeValue)){ re.lastIndex = 0; continue; }
    re.lastIndex = 0;
    var p = nd.parentNode, skip = false;
    while(p && p !== scope){
      var tag = p.nodeName;
      if(tag === "A" || tag === "BUTTON" || tag === "SCRIPT" || tag === "STYLE" || tag === "TEXTAREA" || tag === "OPTION"){ skip = true; break; }
      p = p.parentNode;
    }
    if(!skip) nodes.push(nd);
  }
  nodes.forEach(function(node){
    var frag = document.createDocumentFragment(), last = 0, m;
    re.lastIndex = 0;
    while((m = re.exec(node.nodeValue))){
      var id = SEC_BY_NUM[m[2]];
      if(!id) continue;
      if(m.index > last) frag.appendChild(document.createTextNode(node.nodeValue.slice(last, m.index)));
      var a = document.createElement("a");
      a.className = "seclink";
      a.href = "#sec-" + id;
      a.textContent = m[0];
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if(last === 0) return;
    if(last < node.nodeValue.length) frag.appendChild(document.createTextNode(node.nodeValue.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

var SESSION_KEY = "";
function getKey(){
  var m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash||"");
  if(m){ SESSION_KEY = m[1]; try{ localStorage.setItem(KEY_STORE, m[1]); }catch(e){} return m[1]; }
  if(SESSION_KEY) return SESSION_KEY;
  try{ return localStorage.getItem(KEY_STORE) || ""; }catch(e){ return ""; }
}
/* The gate. Obfuscation, not encryption: this whole file is readable by anyone
   who opens view-source. It stops a person who lands on the bare URL, which is
   what it is for. Real access control would need a different host. */
function hashKey(str){
  var h = 5381, i;
  for(i=0;i<str.length;i++){ h = (((h*33) ^ str.charCodeAt(i)) >>> 0); }
  return h.toString(36);
}
var PASS_HASH = "1fa87go";
function keyOk(k){ return !!k && hashKey(String(k).toLowerCase()) === PASS_HASH; }

    '<div class="gate">'+
      '<p class="eyebrow">Coach Marc Montoya</p>'+
      '<h1>Roadmap to Gold</h1>'+
      '<p class="gate-note">This one is private. Use the link I sent you, or type the passcode below.</p>'+
      '<div class="gate-form">'+
        '<input id="gate-input" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Passcode" placeholder="Passcode">'+
        '<button type="button" id="gate-go" class="btn">Open</button>'+
      '</div>'+
      '<p class="gate-err" id="gate-err" hidden>That is not it. The passcode is the part of my link after <b>#k=</b>.</p>'+
    '</div>';
  var input = document.getElementById("gate-input");
  function tryOpen(ev){
    if(ev && ev.preventDefault) ev.preventDefault();
    var v = (input.value||"").trim().toLowerCase();
    if(keyOk(v)){
      SESSION_KEY = v;
      try{ localStorage.setItem(KEY_STORE, v); }catch(e){}
      try{ if((location.hash||"").indexOf("k=") < 0) location.hash = "#k=" + v; }catch(e){}
      startPage();
    } else {
      document.getElementById("gate-err").hidden = false;
      input.select();
    }
  }
  document.getElementById("gate-go").addEventListener("click", tryOpen);
  input.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" || ev.keyCode === 13) tryOpen(ev);
  });
  try{ input.focus(); }catch(e){}
}

function getDevice(){
  var d=""; try{ d = localStorage.getItem(DEVICE_STORE) || ""; }catch(e){}
  if(!d){ d = Math.random().toString(36).slice(2,10); try{ localStorage.setItem(DEVICE_STORE, d); }catch(e){} }
  return d;
}
function payload(status){
  var p = new URLSearchParams(), n = 0;
  DECISIONS.forEach(function(d){
    var a = answers[d.id] || {}, txt = (a.v==null?"":String(a.v)).trim();
    if(String(a.n||"").trim()) txt += (txt?"\n":"") + "Note: " + a.n;
    if(isAnswered(d.id)) n++;
    p.append(d.id, txt);
  });
  var now = new Date();
  p.append("status", status||"In progress");
  p.append("save", (status==="Submitted"?"SUBMITTED ":"Save ") + now.toLocaleString([], {month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}) + " · " + n + " decided");
  p.append("savedAt", now.toISOString());
  p.append("answered", String(n));
  p.append("device", getDevice());
  p.append("passcode", getKey());
  p.append("json", JSON.stringify(answers));
  return {body:p, n:n};
}
function showCopy(){ var b=document.getElementById("pg-copy"); if(b) b.hidden=false; }
function send(opts){
  opts = opts || {};
  var sig = JSON.stringify(answers), status = opts.status || "In progress";
  if(opts.quiet && sig === lastSentSig) return Promise.resolve();
  try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({t:Date.now(), answers:answers})); }catch(e){}
  if(!getKey()){
    if(!opts.quiet){ showCopy(); setStatus("Saved on this device. This link is missing its key, so it can't reach me — open the exact link I sent, or press Copy answers.","bad"); }
    return Promise.resolve();
  }
  var pl = payload(status);
  return fetch(HOOK, {method:"POST", mode:"no-cors", keepalive:!!opts.quiet, body:pl.body}).then(function(){
    lastSentSig = sig; dirty = false;
    try{ localStorage.setItem(SENT_STORE, sig); }catch(e){}
    if(status==="Submitted"){
      try{ localStorage.setItem(SUB_STORE, String(Date.now())); }catch(e){}
      setStatus("Submitted. Thank you! I have your "+pl.n+" decision"+(pl.n===1?"":"s")+". Change anything and press Submit again.","good");
      return;
    }
    if(!opts.quiet) setStatus("Progress saved: "+pl.n+" decision"+(pl.n===1?"":"s")+" at "+fmtDate(Date.now())+". I have them.","good");
  });
}
function saveNow(){
  if(saving) return;
  saving = true;
  var btn = document.getElementById("pg-save"); btn.disabled = true; setStatus("Saving…");
  send().then(function(){ saving=false; btn.disabled=false; }, function(){
    saving=false; btn.disabled=false; showCopy();
    setStatus("Couldn't reach me right now (check your connection). Your answers are safe on this device.","bad");
  });
}
function submitAll(){
  if(saving) return;
  var blanks = DECISIONS.filter(function(d){ return d.need && !isAnswered(d.id); }).length;
  var sb = document.getElementById("pg-submit");
  if(blanks && !confirmSubmit){
    confirmSubmit = true; sb.textContent = "Submit anyway";
    setStatus(blanks+" decision"+(blanks===1?" marked Needed for the plan is":"s marked Needed for the plan are")+" still open. Fill them in, or press Submit anyway and I'll talk them through.","bad");
    return;
  }
  confirmSubmit = false; sb.textContent = "Submit";
  saving = true; sb.disabled = true; setStatus("Submitting…");
  send({status:"Submitted"}).then(function(){ saving=false; sb.disabled=false; }, function(){
    saving=false; sb.disabled=false; showCopy();
    setStatus("Couldn't reach me right now (check your connection). Your answers are safe on this device.","bad");
  });
}
function summary(){
  var lines = ["COACH MARC MONTOYA — ROADMAP DECISIONS","("+new Date().toLocaleDateString()+")",""];
  DECISIONS.forEach(function(d){
    var a = answers[d.id]; if(!a) return;
    var v = a.v || "";
    if(!String(v).trim() && !String(a.n||"").trim()) return;
    lines.push("Q: "+d.q);
    if(String(v).trim()) lines.push("A: "+v);
    if(String(a.n||"").trim()) lines.push("Note: "+a.n);
    lines.push("");
  });
  return lines.join("\n");
}
function copyAnswers(){
  var text = summary(), box = document.getElementById("pg-copybox"), ta = document.getElementById("pg-copytext");
  ta.value = text;
  var fallback = function(){ box.hidden=false; ta.focus(); ta.select(); setStatus("Your answers are in the box at the bottom. Select all, copy, and send them to me."); box.scrollIntoView({block:"center"}); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ setStatus("Copied. Paste it into a text or email to me.","good"); }, fallback); }
    else fallback();
  }catch(e){ fallback(); }
}

/* ---------- boot ---------- */
function startPage(){
  render(); wire(); refresh(); syncAllBtn();
  var decided = DECISIONS.filter(function(d){ return isAnswered(d.id); }).length;
  var submittedAt = 0; try{ submittedAt = +localStorage.getItem(SUB_STORE)||0; }catch(e){}
  if(submittedAt){ setStatus("You submitted on "+fmtDate(submittedAt)+". Change anything and press Submit again.","good"); }
  else if(restoredAt && decided){ setStatus("Welcome back. Your "+decided+" saved decision"+(decided===1?"":"s")+" from "+fmtDate(restoredAt)+" are right where you left them.","good"); }
  else { setStatus("Read what you like, decide what you can. Press Save progress anytime."); }
}
if(keyOk(getKey())) startPage(); else renderGate();
})();
</script>
